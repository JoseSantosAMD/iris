name: Copilot Setup Steps

on:
  workflow_dispatch:
  issue_comment:
    types: [created, edited]

jobs:
  copilot-setup-steps:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@copilot'))
    runs-on: [self-hosted, copilot, apptainer, iris]

    permissions:
      contents: read
      pull-requests: read

    timeout-minutes: 10

    env:
      # Timeout in ms for Playwright MCP startup; may be used by Copilot runner if supported (avoids indefinite hang)
      COPILOT_MCP_PLAYWRIGHT_TIMEOUT_MS: 60000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create task venv for Copilot
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p "${RUNNER_WORKDIR}/.home" "${RUNNER_WORKDIR}/.tmp" "${RUNNER_WORKDIR}/.pip-cache"
          echo "HOME=${RUNNER_WORKDIR}/.home" >> "$GITHUB_ENV"
          echo "TMPDIR=${RUNNER_WORKDIR}/.tmp" >> "$GITHUB_ENV"
          /opt/venv/bin/python -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e . --no-cache-dir

      - name: Install IntelliKit Python packages
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          # accordo requires kerneldb which needs libdwarf-dev; skipped until added to container
          # pip install --no-cache-dir "git+https://github.com/AMDResearch/intellikit.git#subdirectory=accordo"
          pip install --no-cache-dir "git+https://github.com/AMDResearch/intellikit.git#subdirectory=linex"
          pip install --no-cache-dir "git+https://github.com/AMDResearch/intellikit.git#subdirectory=metrix"
          pip install --no-cache-dir "git+https://github.com/AMDResearch/intellikit.git#subdirectory=nexus"

      - name: Install IntelliKit agent skills
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p .github/agents/skills
          curl -sSL https://raw.githubusercontent.com/AMDResearch/intellikit/main/install/skills/install.sh | \
            bash -s -- --target agents --base-url https://raw.githubusercontent.com/AMDResearch/intellikit/main
          cp -r .agents/skills/* .github/agents/skills/ 2>/dev/null || true

      - name: Make venv default for subsequent steps
        run: |
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.venv/lib/python3.13/site-packages:$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Print MCP config (if set)
        run: |
          if [ -n "${GITHUB_COPILOT_MCP_JSON_FROM_INPUT:-}" ]; then
            echo "MCP config (decoded from GITHUB_COPILOT_MCP_JSON_FROM_INPUT):"
            echo "$GITHUB_COPILOT_MCP_JSON_FROM_INPUT" | base64 -d 2>/dev/null | jq . 2>/dev/null || echo "$GITHUB_COPILOT_MCP_JSON_FROM_INPUT" | base64 -d 2>/dev/null || echo "(decode failed)"
          else
            echo "GITHUB_COPILOT_MCP_JSON_FROM_INPUT is not set in this step (runner may set it only for Start MCP servers step)."
          fi

      - name: Verify ROCm and GPU visibility
        run: |
          echo "=== rocminfo ==="
          rocminfo | head -50 || true
          echo "=== rocm-smi ==="
          rocm-smi || true
