name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: [self-hosted, copilot]

    permissions:
      contents: read

    timeout-minutes: 59

    steps:
      # Copilot launcher expects Node at RUNNER_TEMP/ghcca-node/node/bin/node
      - name: Ensure Node at Copilot tool-cache path
        run: |
          TEMP_DIR="${RUNNER_TEMP:-${RUNNER_WORKDIR}/_temp}"
          GHCCA_NODE="${TEMP_DIR}/ghcca-node/node"
          if [ ! -f "${GHCCA_NODE}/bin/node" ]; then
            echo "Installing Node at ${TEMP_DIR}/ghcca-node for Copilot runtime..."
            mkdir -p "${TEMP_DIR}/ghcca-node"
            cd "${TEMP_DIR}/ghcca-node"
            curl -sL "https://nodejs.org/dist/v20.18.0/node-v20.18.0-linux-x64.tar.xz" | tar -xJ
            mv node-v20.18.0-linux-x64 node
          fi

      - name: Set up Node.js for Copilot runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create task venv for Copilot
        run: |
          cd "$GITHUB_WORKSPACE"
          # Set cache dirs once so pip/uv use them; no --cache-dir needed in later steps
          echo "PIP_CACHE_DIR=$GITHUB_WORKSPACE/.pip-cache" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$GITHUB_WORKSPACE/.uv-cache" >> "$GITHUB_ENV"
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install IntelliKit Python packages
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          # accordo and nexus require kerneldb which needs libdwarf-dev; skipped until added to container
          # pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=accordo"
          # pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=nexus"
          pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=linex"
          pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=metrix"

      - name: Install uv for MCP servers
        run: |
          source "$GITHUB_WORKSPACE/.venv/bin/activate"
          pip install uv

      - name: Clone IntelliKit for MCP servers
        run: |
          git clone --depth 1 https://github.com/AMDResearch/intellikit.git "$GITHUB_WORKSPACE/.intellikit"

      - name: Install IntelliKit agent skills
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p .github/agents/skills
          curl -sSL https://raw.githubusercontent.com/AMDResearch/intellikit/main/install/skills/install.sh | \
            bash -s -- --target agents --base-url https://raw.githubusercontent.com/AMDResearch/intellikit/main
          cp -r .agents/skills/* .github/agents/skills/ 2>/dev/null || true

      - name: Make venv default for subsequent steps
        run: |
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify ROCm and GPU visibility
        run: |
          echo "=== rocminfo ==="
          rocminfo | head -50 || true
          echo "=== rocm-smi ==="
          rocm-smi || true
