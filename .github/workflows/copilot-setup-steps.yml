name: Copilot Setup Steps

on:
  workflow_dispatch:
  issue_comment:
    types: [created, edited]

jobs:
  copilot-setup-steps:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@copilot'))
    runs-on: [self-hosted, copilot, apptainer, iris]

    permissions:
      contents: read
      pull-requests: read

    timeout-minutes: 59

    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create task venv for Copilot
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
          TMPDIR: ${{ github.workspace }}/.tmp
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p .pip-cache .tmp
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install IntelliKit Python packages
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
        run: |
          source $GITHUB_WORKSPACE/.venv/bin/activate
          pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=accordo"
          pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=linex"
          pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=metrix"
          pip install "git+https://github.com/AMDResearch/intellikit.git#subdirectory=nexus"

      - name: Install uv for MCP servers
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
          UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
        run: |
          source $GITHUB_WORKSPACE/.venv/bin/activate
          pip install uv

      - name: Clone IntelliKit for MCP servers
        run: |
          git clone --depth 1 https://github.com/AMDResearch/intellikit.git $GITHUB_WORKSPACE/.intellikit

      - name: Install IntelliKit agent skills
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p .github/agents/skills
          curl -sSL https://raw.githubusercontent.com/AMDResearch/intellikit/main/install/skills/install.sh | \
            bash -s -- --target agents --base-url https://raw.githubusercontent.com/AMDResearch/intellikit/main
          cp -r .agents/skills/* .github/agents/skills/ 2>/dev/null || true

      - name: Make venv default for subsequent steps
        run: |
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Verify ROCm and GPU visibility
        run: |
          echo "=== rocminfo ==="
          rocminfo | head -50 || true
          echo "=== rocm-smi ==="
          rocm-smi || true
