name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: [self-hosted, copilot]

    permissions:
      contents: read

    timeout-minutes: 59

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Iris into container venv
        run: |
          /opt/venv/bin/pip install -e .

      - name: Make container venv default for subsequent steps
        run: |
          echo "/opt/venv/bin" >> $GITHUB_PATH

      - name: Verify ROCm and GPU visibility
        run: |
          echo "=== rocminfo ==="
          rocminfo | head -50 || true
          echo "=== rocm-smi ==="
          rocm-smi || true
